name: GPU worker

on:
  pull_request:
    paths:
      - apps/image-worker/**
      - docker-compose.yml
      - infra/docker/docker-compose.gpu.yml
      - .github/workflows/gpu-worker.yml
  push:
    branches: [main]
    paths:
      - apps/image-worker/**
      - docker-compose.yml
      - infra/docker/docker-compose.gpu.yml
      - .github/workflows/gpu-worker.yml

jobs:
  sdxl-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the PyTorch image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build GPU worker image
        run: docker build -f apps/image-worker/Dockerfile.gpu -t comic-image-worker-gpu apps/image-worker
      - name: Validate GPU compose override
        run: |
          node scripts/init-env.mjs
          docker compose -f docker-compose.yml -f infra/docker/docker-compose.gpu.yml --profile gpu config --quiet
      - name: Real Diffusers SDXL inference on CPU with a tiny model
        run: >
          docker run --rm
          -e RUN_SDXL_CPU=1
          -e CELERY_BROKER_URL=memory://
          -e SDXL_MODEL_ID=hf-internal-testing/tiny-stable-diffusion-xl-pipe
          -v "$PWD/apps/image-worker/tests:/app/tests:ro"
          comic-image-worker-gpu
          python -m pytest -q -p no:cacheprovider tests
