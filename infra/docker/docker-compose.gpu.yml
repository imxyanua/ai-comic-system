# Worker SDXL thật trên GPU NVIDIA. Cần NVIDIA Container Toolkit.
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.gpu.yml --profile gpu up --build
# Lần đầu tải model SDXL (vài GB) vào volume model-cache.
services:
  image-worker-mock:
    profiles: ["mock"]

  image-worker:
    profiles: ["gpu"]
    build:
      context: ../../apps/image-worker
      dockerfile: Dockerfile.gpu
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: comic-assets
      MINIO_USE_SSL: "false"
      API_INTERNAL_URL: http://api:3000
      INTERNAL_SERVICE_TOKEN: dev-only
      MOCK_INFERENCE: "0"
      INFERENCE_DEVICE: cuda
      SDXL_MODEL_ID: stabilityai/stable-diffusion-xl-base-1.0
    volumes:
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  model-cache:
